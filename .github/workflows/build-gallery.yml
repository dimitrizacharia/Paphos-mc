name: Build gallery & library

# Drop photos into gallery/ or PDFs into library/ and commit.
# This optimises the photos and updates gallery.json / library.json automatically.

on:
  push:
    paths:
      - "gallery/**"
      - "library/**"
      - "scripts/build_assets.py"
      - ".github/workflows/build-gallery.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build optimised images and manifests
        run: python scripts/build_assets.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A img gallery.json library.json
            git commit -m "Update optimised gallery + library manifests"
            git push
          fi
